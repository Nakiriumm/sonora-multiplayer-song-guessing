<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-labelledby="title description">
  <title id="title">SONORA vinyl record player</title>
  <desc id="description">A grooved black vinyl record on a burgundy turntable with a coral SONORA label and a cream tonearm.</desc>
  <defs>
    <radialGradient id="vinyl" cx="38%" cy="32%" r="72%">
      <stop offset="0" stop-color="#243c38" />
      <stop offset=".72" stop-color="#132a27" />
      <stop offset="1" stop-color="#0d201e" />
    </radialGradient>
    <linearGradient id="recordEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#29433e" />
      <stop offset="1" stop-color="#101f1d" />
    </linearGradient>
  </defs>

  <!-- Deep green canvas and angled turntable plinth -->
  <path fill="#743b43" d="M127 27 537 65 444 338 12 273z" />
  <path fill="#0e1a18" opacity=".42" d="m130 270 299 43 14 25-286-45z" />

  <!-- Tonearm and cartridge -->
  <path d="m325 31 93 26c57 16 71 79 45 133l-15 29" fill="none" stroke="#eee9d9" stroke-linecap="round" stroke-width="8" />
  <path d="m305 33 20-23 23 21-21 22z" fill="#df795f" />
  <path d="m440 211 28-19 10 12-29 20z" fill="#eee9d9" />

  <!-- Record shadow and shallow outer edge -->
  <ellipse cx="291" cy="238" rx="164" ry="155" fill="#0b1715" opacity=".48" />
  <circle cx="278" cy="214" r="149" fill="url(#recordEdge)" />
  <circle cx="278" cy="211" r="145" fill="url(#vinyl)" />

  <!-- Fine pressed grooves -->
  <g fill="none" stroke="#71817a" stroke-opacity=".29" stroke-width="2">
    <circle cx="278" cy="211" r="141" />
    <circle cx="278" cy="211" r="136" />
    <circle cx="278" cy="211" r="131" />
    <circle cx="278" cy="211" r="126" />
    <circle cx="278" cy="211" r="121" />
    <circle cx="278" cy="211" r="116" />
    <circle cx="278" cy="211" r="111" />
    <circle cx="278" cy="211" r="106" />
    <circle cx="278" cy="211" r="101" />
    <circle cx="278" cy="211" r="96" />
    <circle cx="278" cy="211" r="91" />
    <circle cx="278" cy="211" r="86" />
    <circle cx="278" cy="211" r="81" />
    <circle cx="278" cy="211" r="76" />
    <circle cx="278" cy="211" r="71" />
    <circle cx="278" cy="211" r="66" />
    <circle cx="278" cy="211" r="61" />
  </g>
  <g fill="none" stroke="#071715" stroke-opacity=".72" stroke-width="2">
    <circle cx="278" cy="211" r="138.5" />
    <circle cx="278" cy="211" r="128.5" />
    <circle cx="278" cy="211" r="118.5" />
    <circle cx="278" cy="211" r="108.5" />
    <circle cx="278" cy="211" r="98.5" />
    <circle cx="278" cy="211" r="88.5" />
    <circle cx="278" cy="211" r="78.5" />
    <circle cx="278" cy="211" r="68.5" />
  </g>

  <!-- Coral record label -->
  <circle cx="278" cy="214" r="53" fill="#e47c63" />
  <text x="278" y="196" fill="#fff4e7" text-anchor="middle" font-family="DM Sans, Arial, sans-serif" font-size="11" font-weight="800" letter-spacing="1.1">SONORA</text>
  <circle cx="278" cy="214" r="4" fill="#182622" />
  <text x="278" y="231" fill="#fff4e7" text-anchor="middle" font-family="DM Sans, Arial, sans-serif" font-size="7" font-weight="800" letter-spacing="1.2">STEREO</text>
</svg>
