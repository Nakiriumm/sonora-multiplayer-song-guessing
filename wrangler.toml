name = "sonora-multiplayer-song-guessing"
main = "worker.js"
compatibility_date = "2026-10-10"

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = ["/api/*", "/ws/*"]

[[durable_objects.bindings]]
name = "GAME_ROOMS"
class_name = "GameRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]
